@if (loading()) {
  <div class="card border-0 shadow-sm">
    <div class="card-body text-center py-5 text-muted">Loading ticket...</div>
  </div>
} @else if (ticket(); as t) {
  <div class="mb-4">
    <a [routerLink]="['/tickets', t.id]" class="text-muted small text-decoration-none">
      <i class="ti ti-arrow-left"></i> Back to ticket
    </a>
    <div class="d-flex align-items-center gap-2 mt-2">
      <span class="code-chip fs-6">{{ t.ticketNumber }}</span>
    </div>
    <h4 class="fw-bold mb-0 mt-2">Edit Ticket</h4>
    <p class="text-muted small mb-0">
      You can edit this ticket until our IT team starts working on it.
    </p>
  </div>

  <div class="row">
    <div class="col-lg-8">
      <app-ticket-form
        [existingTicket]="t"
        [submitting]="submitting()"
        submitLabel="Save Changes"
        (formSubmit)="onSubmit($event)"
      />
    </div>
  </div>
}
