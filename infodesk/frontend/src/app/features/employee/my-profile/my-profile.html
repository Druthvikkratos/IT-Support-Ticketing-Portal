<div class="mb-4"><h4 class="fw-bold mb-0">My Profile</h4></div>
<div class="card border-0 shadow-sm" style="max-width: 480px;">
  <div class="card-body p-4">
    <div class="d-flex align-items-center gap-3 mb-4">
      <div class="detail-avatar" style="width:56px;height:56px;font-size:1.4rem;">{{ authService.currentUser()?.name?.charAt(0) }}</div>
      <div>
        <div class="fw-bold fs-5">{{ authService.currentUser()?.name }}</div>
        <div class="text-muted small">{{ authService.currentUser()?.employeeCode }}</div>
      </div>
    </div>
    <div class="detail-row"><span class="detail-label">Email: </span><span class="detail-value">{{ authService.currentUser()?.email }}</span></div>
    <hr />
    <a routerLink="/forgot-password" class="btn btn-outline-secondary w-100">
      <i class="ti ti-key me-1"></i> Change Password
    </a>
  </div>
</div>
