<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h4 class="fw-bold mb-0">Raise a Ticket</h4>
    <p class="text-muted small mb-0">Describe your issue and our IT team will get back to you.</p>
  </div>
  <button (click)="goBack()" class="btn btn-primary d-flex align-items-center gap-2">
    <i class="ti ti-arrow-narrow-left"></i> Back
  </button>
</div>

<div class="row">
    <app-ticket-form
      [submitting]="isSubmitting()"
      submitLabel="Submit Ticket"
      (formSubmit)="onSubmit($event)"
    />
</div>
