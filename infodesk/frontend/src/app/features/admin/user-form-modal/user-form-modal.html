<div class="modal-backdrop-custom" (click)="close(false)"></div>
<div class="modal-panel">
  <div class="modal-content-custom">
    <div class="d-flex justify-content-between align-items-center p-4 border-bottom">
      <h5 class="fw-bold mb-0">Add User</h5>
      <button class="btn-close" (click)="close(false)"></button>
    </div>

    <div class="p-4">
      @if (successInfo()) {
        <div class="alert alert-success">
          {{ successInfo() }}
          <div class="mt-2">
            <button class="btn btn-sm btn-success" (click)="close(true)">Done</button>
          </div>
        </div>
      } @else {
        <div class="btn-group w-100 mb-4">
          <button
            class="btn"
            [class.btn-primary]="role() === 'employee'"
            [class.btn-outline-secondary]="role() !== 'employee'"
            (click)="role.set('employee')"
          >
            Employee
          </button>
          <button
            class="btn"
            [class.btn-primary]="role() === 'admin'"
            [class.btn-outline-secondary]="role() !== 'admin'"
            (click)="role.set('admin')"
          >
            Admin
          </button>
        </div>

        @if (errorMessage()) {
          <div class="alert alert-danger py-2 small">{{ errorMessage() }}</div>
        }

        @if (role() === 'employee') {
          <form [formGroup]="employeeForm" (ngSubmit)="submit()">
            <div class="mb-3">
              <label class="form-label small">Employee Name</label>
              <input class="form-control" formControlName="name" />
            </div>
            <div class="mb-3">
              <label class="form-label small">Employee Code (4 digits)</label>
              <input class="form-control" formControlName="employeeCode" maxlength="4" placeholder="0001" />
            </div>
            <div class="mb-3">
              <label class="form-label small">Company Email</label>
              <input class="form-control" formControlName="email" />
            </div>
            <div class="alert alert-info small">
              Password auto-generates as <code>Infomap&#64;{{ employeeForm.value.employeeCode || '____' }}</code>
            </div>
            <button class="btn btn-primary w-100" [disabled]="employeeForm.invalid || submitting()">
              @if (submitting()) { <span class="spinner-border spinner-border-sm me-2"></span> }
              Create Employee
            </button>
          </form>
        } @else {
          <form [formGroup]="adminForm" (ngSubmit)="submit()">
            <div class="mb-3">
              <label class="form-label small">Admin Name</label>
              <input class="form-control" formControlName="name" />
            </div>
            <div class="mb-3">
              <label class="form-label small">Company Email</label>
              <input class="form-control" formControlName="email" />
            </div>
            <div class="mb-3">
              <label class="form-label small">Password</label>
              <input type="password" class="form-control" formControlName="password" />
            </div>
            <button class="btn btn-primary w-100" [disabled]="adminForm.invalid || submitting()">
              @if (submitting()) { <span class="spinner-border spinner-border-sm me-2"></span> }
              Create Admin
            </button>
          </form>
        }
      }
    </div>
  </div>
</div>
