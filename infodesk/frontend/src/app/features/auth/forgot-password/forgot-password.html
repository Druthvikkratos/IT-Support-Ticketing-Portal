<div class="login-page d-flex align-items-center justify-content-center vh-100">
  <div class="card shadow-lg border-0" style="width: 400px;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <div class="brand-badge mx-auto mb-3">ID</div>
        <h4 class="fw-bold mb-1">Reset Password</h4>
        <p class="text-muted small mb-0">Verify your identity to set a new password</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label small text-muted">Employee Code</label>
          <input class="form-control" formControlName="employeeCode" maxlength="4" placeholder="0001" />
        </div>
        <div class="mb-3">
          <label class="form-label small text-muted">Registered Email</label>
          <input class="form-control" formControlName="email" placeholder="you@company.com" />
        </div>
        <div class="mb-3">
          <label class="form-label small text-muted">New Password</label>
          <div class="password-input-wrapper">
            <input [type]="showPassword() ? 'text' : 'password'" class="form-control" formControlName="newPassword" />
            <button type="button" class="password-toggle-btn" (click)="toggleShow()">
              <i class="ti" [class.ti-eye]="!showPassword()" [class.ti-eye-off]="showPassword()"></i>
            </button>
          </div>
        </div>

        @if (errorMessage()) { <div class="alert alert-danger py-2 small">{{ errorMessage() }}</div> }

        <button type="submit" class="btn btn-primary w-100 mt-2" [disabled]="form.invalid || loading()">
          @if (loading()) { <span class="spinner-border spinner-border-sm me-2"></span> }
          Reset Password
        </button>

        <div class="text-center mt-3">
          <a routerLink="/login" class="small text-muted">Back to login</a>
        </div>
      </form>
    </div>
  </div>
</div>
